<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="140" x2="940" y2="940">
      <stop offset="0" stop-color="#e3c595"/>
      <stop offset="0.55" stop-color="#c49a6c"/>
      <stop offset="1" stop-color="#8a5f3d"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#2a1d15"/>
      <stop offset="1" stop-color="#0f0b09"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- thin ring (stays inside Instagram's circular crop) -->
  <circle cx="540" cy="540" r="470" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <circle cx="540" cy="540" r="452" fill="none" stroke="#c49a6c" stroke-width="1.5" opacity="0.45"/>
  <!-- snowflake -->
  <g transform="translate(540 405)" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <g id="arm">
      <path d="M0 0V-135"/>
      <path d="M-34 -98L0 -70L34 -98"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <circle r="16" fill="#0f0b09" stroke-width="10"/>
  </g>
  <!-- wordmark -->
  <text x="540" y="700" text-anchor="middle" font-family="'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif" font-size="150" font-weight="600" letter-spacing="34" fill="#f6f1ea" dx="17">FROST</text>
  <line x1="400" y1="745" x2="680" y2="745" stroke="url(#gold)" stroke-width="3"/>
  <text x="540" y="800" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="32" letter-spacing="14" fill="#c49a6c" dx="7">PREMIUM  CLOTHING</text>
</svg>
